<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta confirmada — GuideTracker Live</title>
<style>
  :root { --azul:#1565C0; --tinta:#1a1a2e; }
  body { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         max-width:520px; margin:0 auto; padding:60px 24px; color:var(--tinta);
         line-height:1.6; text-align:center; }
  .check { width:88px; height:88px; border-radius:50%; background:#eaf6ec;
           display:flex; align-items:center; justify-content:center;
           margin:0 auto 24px; font-size:46px; }
  h1 { color:var(--azul); font-size:26px; margin-bottom:8px; }
  .card { background:#f4f6fb; border-radius:12px; padding:20px; margin:28px 0;
          text-align:left; }
  .card ol { padding-left:20px; margin:8px 0 0; }
  .btn { display:inline-block; background:var(--azul); color:#fff;
         text-decoration:none; padding:14px 28px; border-radius:10px;
         font-weight:600; }
  footer { margin-top:40px; color:#666; font-size:14px; }
  a { color:var(--azul); }
</style>
</head>
<body>
  <div class="check">✓</div>
  <h1>¡Tu cuenta está confirmada!</h1>
  <p>Ya puedes usar GuideTracker Live.</p>

  <p style="margin:28px 0">
    <a class="btn" href="guidetrackerlive://login-callback">Abrir la app</a>
  </p>

  <div class="card">
    <strong>¿No se abrió sola?</strong>
    <ol>
      <li>Abre <strong>GuideTracker Live</strong> desde tu teléfono.</li>
      <li>Inicia sesión con tu correo y contraseña.</li>
    </ol>
  </div>

  <footer>
    GuideTracker Live ·
    <a href="index.html">Información legal</a><br>
    ¿Problemas? Escríbenos a
    <a href="mailto:guidetrackerlive@gmail.com">guidetrackerlive@gmail.com</a>
  </footer>
</body>
</html>
